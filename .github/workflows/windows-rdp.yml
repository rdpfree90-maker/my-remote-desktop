name: Windows RDP via Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect Windows runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Prepare persistent tool/cache folders
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = "C:\RDPTools"
          New-Item -ItemType Directory -Force -Path $tools, "$tools\Installers", "$tools\AndroidStudio" | Out-Null
          Write-Host "Tools root: $tools"

      - name: Restore tool cache
        uses: actions/cache@v4
        with:
          path: C:\RDPTools
          key: windows-tools-${{ runner.os }}-androidstudio-v1
          restore-keys: |
            windows-tools-${{ runner.os }}-

      - name: Optimize Windows desktop for portrait RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $desktop = "HKCU:\Software\Microsoft\Windows\Shell\Bags\1\Desktop"
          New-Item -Path $desktop -Force | Out-Null
          Set-ItemProperty -Path $desktop -Name "IconSize" -Type DWord -Value 32 -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $desktop -Name "Mode" -Type DWord -Value 4 -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "LogPixels" -Type DWord -Value 96 -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop\WindowMetrics" -Name "IconSpacing" -Type String -Value "-1050" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop\WindowMetrics" -Name "IconVerticalSpacing" -Type String -Value "-1050" -ErrorAction SilentlyContinue
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Start-Process explorer.exe

      - name: Configure Windows RDP
        shell: pwsh
        env:
          RDP_USERNAME: ${{ secrets.user_name }}
          RDP_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:RDP_USERNAME)) { throw "GitHub Secret user_name is missing." }
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { throw "GitHub Secret PASSWORD is missing." }

          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $user = Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue
          if ($null -eq $user) {
            New-LocalUser -Name $env:RDP_USERNAME -Password $securePassword -Description "Temporary GitHub Actions RDP user" -PasswordNeverExpires -AccountNeverExpires -UserMayNotChangePassword
          } else {
            Set-LocalUser -Name $env:RDP_USERNAME -Password $securePassword
            Enable-LocalUser -Name $env:RDP_USERNAME
          }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue

          $rdpHome = Join-Path "C:\Users" $env:RDP_USERNAME
          $rdpDesktop = Join-Path $rdpHome "Desktop"
          New-Item -ItemType Directory -Force -Path $rdpDesktop | Out-Null
          New-Item -ItemType Directory -Force -Path "$rdpDesktop\Telegram", "$rdpDesktop\ملفات عادية", "$rdpDesktop\AndroidStudio\Projects", "$rdpDesktop\AndroidStudio\Incoming", "$rdpDesktop\AndroidStudio\APKs" | Out-Null

          # Let the current runner account write to the RDP user's working folders.
          icacls $rdpHome /grant "${env:RDP_USERNAME}:(OI)(CI)F" /T /C | Out-Null
          icacls $rdpDesktop /grant "Administrators:(OI)(CI)F" /T /C | Out-Null

          Restart-Service TermService -Force
          Start-Sleep -Seconds 3
          if ($null -eq (Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue)) { throw "RDP is not listening on TCP 3389." }

          "RDP_DESKTOP=$rdpDesktop" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RDP desktop: $rdpDesktop"

      - name: Check and install Android Studio only when needed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "$env:ProgramFiles\Android\Android Studio\bin\studio64.exe",
            "$env:LOCALAPPDATA\Programs\Android Studio\bin\studio64.exe",
            "$env:ProgramFiles\Android\Android Studio\bin\studio.exe"
          )
          $studio = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($studio) {
            Write-Host "Android Studio already installed: $studio"
          } else {
            Write-Host "Android Studio not found. Installing..."
            $winget = Get-Command winget -ErrorAction SilentlyContinue
            if ($winget) {
              winget install --id Google.AndroidStudio --exact --silent --accept-source-agreements --accept-package-agreements
            } else {
              $choco = Get-Command choco -ErrorAction SilentlyContinue
              if (-not $choco) { throw "Neither winget nor Chocolatey is available." }
              choco install androidstudio -y --no-progress
            }
            Start-Sleep -Seconds 5
            $studio = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $studio) { throw "Android Studio installation finished but studio64.exe was not found." }
          }

          $desktop = $env:RDP_DESKTOP
          $ws = New-Object -ComObject WScript.Shell
          $shortcut = $ws.CreateShortcut((Join-Path $desktop "Android Studio.lnk"))
          $shortcut.TargetPath = $studio
          $shortcut.WorkingDirectory = Split-Path $studio
          $shortcut.Save()

          $toolsShortcut = $ws.CreateShortcut((Join-Path $desktop "Tools.lnk"))
          $toolsShortcut.TargetPath = "C:\RDPTools"
          $toolsShortcut.Save()

      - name: Install Telegram bot dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyTelegramBotAPI

      - name: Start Telegram File Receiver
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          RDP_DESKTOP: ${{ env.RDP_DESKTOP }}
        run: |
          $ErrorActionPreference = "Stop"
          $bot = Join-Path $env:GITHUB_WORKSPACE "telegram_receiver.py"
          if (-not (Test-Path $bot)) { throw "telegram_receiver.py is missing from the checked-out repository." }
          Write-Host "Starting Telegram receiver: $bot"
          $proc = Start-Process -FilePath "python" -ArgumentList @("-u", $bot) -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) { throw "Telegram receiver exited immediately with code $($proc.ExitCode)." }
          Write-Host "Telegram receiver is running with PID $($proc.Id)."

      - name: Get Tailscale IP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ip = (tailscale ip -4).Trim()
          if ([string]::IsNullOrWhiteSpace($ip)) { throw "Could not get the Tailscale IPv4 address." }
          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Tailscale IPv4: $ip"

      - name: Send RDP details to Telegram
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          RDP_USERNAME: ${{ secrets.user_name }}
          RDP_PASSWORD: ${{ secrets.PASSWORD }}
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}
        run: |
          $ErrorActionPreference = "Stop"
          function Escape-Html([string]$value) { return $value.Replace("&", "&amp;").Replace("<", "&lt;").Replace(">", "&gt;") }
          $message = @"
          🟢 <b>Windows RDP Ready</b>

          🌐 IP: <code>$(Escape-Html $env:TAILSCALE_IP)</code>
          🔌 Port: <code>3389</code>
          👤 User: <code>$(Escape-Html $env:RDP_USERNAME)</code>
          🔑 Pass: <code>$(Escape-Html $env:RDP_PASSWORD)</code>

          🛡️ Tailscale only
          ⏳ Keep the Workflow running.
          "@
          $body = @{ chat_id = $env:ADMIN_ID; text = $message; parse_mode = "HTML" }
          $response = Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:BOT_TOKEN)/sendMessage" -Method Post -ContentType "application/x-www-form-urlencoded" -Body $body
          if (-not $response.ok) { throw "Telegram API returned an unsuccessful response." }

      - name: Keep Windows RDP alive
        shell: pwsh
        run: |
          Write-Host "RDP is active. Keep this workflow running."
          for (;;) {
            Write-Host ("[{0}] RDP is still running..." -f (Get-Date -Format "yyyy-MM-dd HH:mm:ss"))
            Start-Sleep -Seconds 60
          }
