name: Windows RDP via Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Connect Windows runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Optimize Windows desktop for portrait RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          # Do NOT force landscape or change the RDP session resolution.
          # The mobile RDP client can keep the portrait resolution requested by the user.

          # Make desktop icons and spacing a little smaller/cleaner.
          $desktop = "HKCU:\Software\Microsoft\Windows\Shell\Bags\1\Desktop"
          New-Item -Path $desktop -Force | Out-Null
          Set-ItemProperty -Path $desktop -Name "IconSize" -Type DWord -Value 32 -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $desktop -Name "Mode" -Type DWord -Value 4 -ErrorAction SilentlyContinue

          # Keep Windows UI scaling at the normal 100% level.
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "LogPixels" -Type DWord -Value 96 -ErrorAction SilentlyContinue

          # Slightly tighter icon spacing.
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop\WindowMetrics" -Name "IconSpacing" -Type String -Value "-1050" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop\WindowMetrics" -Name "IconVerticalSpacing" -Type String -Value "-1050" -ErrorAction SilentlyContinue

          Write-Host "Portrait RDP layout kept; desktop icons reduced and spacing tightened."

          # Refresh Explorer so the desktop changes are picked up.
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Start-Process explorer.exe
          Start-Sleep -Seconds 3

      - name: Prepare persistent tools folder and restore tool cache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = Join-Path $env:GITHUB_WORKSPACE "tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Write-Host "Tools folder: $tools"

      - name: Cache downloaded tools
        uses: actions/cache@v4
        with:
          path: tools
          key: windows-tools-android-studio-v1

      - name: Check / Install Android Studio (skip download if already installed)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # First look for an existing installation. If found, do NOT run
          # WinGet/Chocolatey, so no unnecessary download is made.
          $candidates = @(
            "$env:ProgramFiles\Android\Android Studio\bin\studio64.exe",
            "$env:LOCALAPPDATA\Programs\Android Studio\bin\studio64.exe",
            "$env:ProgramFiles\Android Studio\bin\studio64.exe",
            "$env:ProgramFiles\Android\Android Studio\bin\studio.exe",
            "$env:LOCALAPPDATA\Programs\Android Studio\bin\studio.exe"
          )

          $studio = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $studio) {
            $studio = Get-ChildItem -Path "$env:ProgramFiles", "$env:LOCALAPPDATA" -Filter studio64.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if ($studio) {
            Write-Host "Android Studio is already installed. Skipping download/install."
          }
          else {
            Write-Host "Android Studio was not found. Installing it now..."
            $installed = $false

            $winget = Get-Command winget -ErrorAction SilentlyContinue
            if ($winget) {
              winget install --id Google.AndroidStudio --exact --silent --accept-source-agreements --accept-package-agreements
              if ($LASTEXITCODE -eq 0) { $installed = $true }
            }

            if (-not $installed) {
              $choco = Get-Command choco -ErrorAction SilentlyContinue
              if ($choco) {
                choco install androidstudio -y --no-progress
                if ($LASTEXITCODE -eq 0) { $installed = $true }
              }
            }

            if (-not $installed) {
              throw "Android Studio installation failed."
            }

            Start-Sleep -Seconds 5

            $studio = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $studio) {
              $studio = Get-ChildItem -Path "$env:ProgramFiles", "$env:LOCALAPPDATA" -Filter studio64.exe -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
            }
          }

          if (-not $studio) {
            throw "Android Studio executable was not found after the check/install step."
          }

          "ANDROID_STUDIO_EXE=$studio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Android Studio: $studio"

          # Create/update the public Desktop shortcut without downloading anything.
          $publicDesktop = [Environment]::GetFolderPath("CommonDesktopDirectory")
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut((Join-Path $publicDesktop "Android Studio.lnk"))
          $shortcut.TargetPath = $studio
          $shortcut.WorkingDirectory = Split-Path $studio
          $shortcut.Save()

      - name: Prepare Android Studio project folders
        shell: pwsh
        env:
          RDP_USERNAME: ${{ secrets.user_name }}
        run: |
          $desktop = Join-Path $env:SystemDrive ("Users\" + $env:RDP_USERNAME + "\Desktop")
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $desktop "AndroidStudio\Projects"), `
            (Join-Path $desktop "AndroidStudio\Incoming"), `
            (Join-Path $desktop "AndroidStudio\APKs"), `
            (Join-Path $desktop "Telegram"), `
            (Join-Path $desktop "محمد") | Out-Null

          # Public shortcut is visible to the RDP user even though the workflow
          # itself runs under the GitHub runner account.
          $studio = @(`
            "$env:ProgramFiles\Android\Android Studio\bin\studio64.exe", `
            "$env:LOCALAPPDATA\Programs\Android Studio\bin\studio64.exe", `
            "$env:ProgramFiles\Android Studio\bin\studio64.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($studio) {
            $publicDesktop = [Environment]::GetFolderPath("CommonDesktopDirectory")
            $shell = New-Object -ComObject WScript.Shell
            $shortcut = $shell.CreateShortcut((Join-Path $publicDesktop "Android Studio.lnk"))
            $shortcut.TargetPath = $studio
            $shortcut.WorkingDirectory = Split-Path $studio
            $shortcut.Save()
          }

          Write-Host "RDP user Desktop prepared: $desktop"

      - name: Configure Windows RDP
        shell: pwsh
        env:
          RDP_USERNAME: ${{ secrets.user_name }}
          RDP_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_USERNAME)) {
            throw "GitHub Secret user_name is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "GitHub Secret PASSWORD is missing."
          }

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          # Allow RDP through Windows Firewall
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Create/reset the requested local Windows user
          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $user = Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -Description "Temporary GitHub Actions RDP user" `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -UserMayNotChangePassword
          }
          else {
            Set-LocalUser -Name $env:RDP_USERNAME -Password $securePassword
            Enable-LocalUser -Name $env:RDP_USERNAME
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Restart-Service TermService -Force

          Start-Sleep -Seconds 3

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $listener) {
            throw "RDP is not listening on TCP 3389."
          }

          Write-Host "RDP listener is ready."

      - name: Resolve RDP Desktop and grant upload access
        shell: pwsh
        env:
          RDP_USERNAME: ${{ secrets.user_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $profile = Join-Path $env:SystemDrive ("Users\" + $env:RDP_USERNAME)
          $desktop = Join-Path $profile "Desktop"

          New-Item -ItemType Directory -Force -Path $desktop | Out-Null
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $desktop "Telegram"), `
            (Join-Path $desktop "AndroidStudio\Projects"), `
            (Join-Path $desktop "AndroidStudio\Incoming"), `
            (Join-Path $desktop "AndroidStudio\APKs") | Out-Null

          # The Telegram receiver runs as the GitHub Actions account, not as
          # the RDP account. Grant that runner account Modify access to the
          # RDP desktop tree so the uploaded files are actually visible in RDP.
          $runnerAccount = "$env:COMPUTERNAME\$env:USERNAME"
          icacls $desktop /grant "${runnerAccount}:(OI)(CI)M" /T /C | Out-Host

          "RDP_PROFILE=$profile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RDP_DESKTOP=$desktop" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "RDP profile: $profile"
          Write-Host "RDP desktop: $desktop"
          Write-Host "Upload permissions granted to: $runnerAccount"

      - name: Get Tailscale IP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ip = (tailscale ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Could not get the Tailscale IPv4 address."
          }

          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Tailscale IPv4: $ip"

      - name: Send RDP details to Telegram
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          RDP_USERNAME: ${{ secrets.user_name }}
          RDP_PASSWORD: ${{ secrets.PASSWORD }}
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:BOT_TOKEN)) {
            throw "GitHub Secret BOT_TOKEN is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:ADMIN_ID)) {
            throw "GitHub Secret ADMIN_ID is missing."
          }

          # Escape values for Telegram HTML formatting.
          function Escape-Html([string]$value) {
            return $value.Replace("&", "&amp;").Replace("<", "&lt;").Replace(">", "&gt;")
          }

          $ip = Escape-Html $env:TAILSCALE_IP
          $username = Escape-Html $env:RDP_USERNAME
          $password = Escape-Html $env:RDP_PASSWORD

          $message = @"
          🟢 <b>Windows RDP Ready</b>

          🌐 IP: <code>$ip</code>
          🔌 Port: <code>3389</code>
          👤 User: <code>$username</code>
          🔑 Pass: <code>$password</code>

          🛡️ Tailscale only
          ⏳ Keep the Workflow running.
          "@


          $body = @{
            chat_id    = $env:ADMIN_ID
            text       = $message
            parse_mode = "HTML"
          }

          $response = Invoke-RestMethod `
            -Uri "https://api.telegram.org/bot$($env:BOT_TOKEN)/sendMessage" `
            -Method Post `
            -ContentType "application/x-www-form-urlencoded" `
            -Body $body

          if (-not $response.ok) {
            throw "Telegram API returned an unsuccessful response."
          }

          Write-Host "Complete RDP details sent to Telegram."

      - name: Start Telegram File Receiver (self-contained)
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          RDP_USERNAME: ${{ secrets.user_name }}
          RDP_PROFILE: ${{ env:RDP_PROFILE }}
          RDP_DESKTOP: ${{ env:RDP_DESKTOP }}
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check pyTelegramBotAPI

          # Always create the receiver at an absolute path. This avoids the
          # "can't open file ... telegram_receiver.py" failure when the repo
          # contains only the workflow (or the file was not checked in).
          $receiver = Join-Path $env:GITHUB_WORKSPACE "telegram_receiver.py"
          if (-not (Test-Path $receiver)) {
            $script = @'
import os, re, shutil, time, zipfile
from pathlib import Path
from threading import Lock
import telebot
from telebot import types

BOT_TOKEN = os.environ["BOT_TOKEN"]
ADMIN_ID = int(os.environ["ADMIN_ID"])
RDP_USERNAME = os.environ.get("RDP_USERNAME", "")
DESKTOP = Path(os.environ.get("RDP_DESKTOP", str(Path.home() / "Desktop")))
TELEGRAM_DIR = DESKTOP / "Telegram"
MOHAMED_DIR = DESKTOP / "محمد"
ANDROID_DIR = DESKTOP / "AndroidStudio"
ANDROID_PROJECTS = ANDROID_DIR / "Projects"
ANDROID_INCOMING = ANDROID_DIR / "Incoming"
ANDROID_APKS = ANDROID_DIR / "APKs"
for folder in (TELEGRAM_DIR, MOHAMED_DIR, ANDROID_PROJECTS, ANDROID_INCOMING, ANDROID_APKS):
    folder.mkdir(parents=True, exist_ok=True)
bot = telebot.TeleBot(BOT_TOKEN)
lock = Lock()
mode = {ADMIN_ID: "telegram"}

def allowed(m): return bool(m.from_user and m.from_user.id == ADMIN_ID)
def safe_name(name, fallback="file"):
    name = Path(name or fallback).name
    name = re.sub(r'[\\/:*?"<>|\x00-\x1f]', "_", name).strip(" .")
    return name or fallback
def unique_path(p):
    if not p.exists(): return p
    for i in range(1,100000):
        q=p.with_name(f"{p.stem} ({i}){p.suffix}")
        if not q.exists(): return q
    raise RuntimeError("Could not create a unique filename")
def menu():
    kb=types.InlineKeyboardMarkup(row_width=1)
    kb.add(types.InlineKeyboardButton("🤖 رفع ملف Android Studio",callback_data="mode:android"))
    kb.add(types.InlineKeyboardButton("📂 رفع ملف محمد",callback_data="mode:mohamed"))
    kb.add(types.InlineKeyboardButton("📁 رفع ملف Telegram Desktop",callback_data="mode:telegram"))
    kb.add(types.InlineKeyboardButton("📍 حالة التخزين",callback_data="status"))
    return kb
def safe_extract(zf,dest):
    dest=dest.resolve()
    for m in zf.infolist():
        raw=m.filename.replace("\\","/").lstrip("/")
        if not raw or raw.endswith("/"): continue
        parts=Path(raw).parts
        if ".." in parts: raise ValueError(f"Unsafe ZIP entry: {m.filename}")
        out=(dest/raw).resolve()
        if dest not in out.parents and out != dest: raise ValueError(f"Unsafe ZIP entry: {m.filename}")
        out.parent.mkdir(parents=True,exist_ok=True)
        with zf.open(m) as src, open(out,"wb") as dst: shutil.copyfileobj(src,dst)
def zip_root(zf):
    names=[n.replace("\\","/").lstrip("/") for n in zf.namelist() if n and not n.endswith("/")]
    if not names: return None
    roots={n.split("/",1)[0] for n in names if "/" in n}
    return next(iter(roots)) if len(roots)==1 and all(n.startswith(next(iter(roots))+"/") or n==next(iter(roots)) for n in names) else None
def extract_project(zip_path,name):
    final=unique_path(ANDROID_PROJECTS/safe_name(name,"AndroidProject"))
    temp=unique_path(ANDROID_INCOMING/("."+final.name+"_extracting")); temp.mkdir(parents=True)
    try:
        with zipfile.ZipFile(zip_path) as z:
            if z.testzip() is not None: raise ValueError("ZIP file is corrupted")
            root=zip_root(z); safe_extract(z,temp)
        source=temp/root if root and (temp/root).is_dir() else temp
        shutil.move(str(source),str(final))
        if temp.exists(): shutil.rmtree(temp,ignore_errors=True)
        return final
    except Exception:
        shutil.rmtree(temp,ignore_errors=True); raise
def save(data,path):
    path=unique_path(path); path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(data); return path
def doc(m):
    info=bot.get_file(m.document.file_id); return safe_name(m.document.file_name),bot.download_file(info.file_path)
@bot.message_handler(commands=["start","menu","help"])
def start(m):
    if allowed(m): bot.send_message(m.chat.id,"🖥️ <b>Windows RDP File Manager</b>\n\nاختار مكان الرفع:",parse_mode="HTML",reply_markup=menu())
@bot.callback_query_handler(func=lambda c:c.data.startswith("mode:"))
def change(c):
    if c.from_user.id!=ADMIN_ID: bot.answer_callback_query(c.id,"غير مسموح"); return
    mode[ADMIN_ID]=c.data.split(":",1)[1]; bot.answer_callback_query(c.id,"تم التغيير")
    labels={"android":"🤖 <b>رفع ملف Android Studio</b>\n\nZIP المشروع → Projects\nAPK → APKs\nأي ملف آخر → Incoming","mohamed":"📂 <b>رفع ملف محمد</b>\n\nأي ملف ترسله الآن → Desktop\محمد","telegram":"📁 <b>رفع ملف Telegram Desktop</b>\n\nأي ملف أو رابط ترسله الآن → Desktop\Telegram"}
    bot.send_message(c.message.chat.id,labels[mode[ADMIN_ID]],parse_mode="HTML",reply_markup=menu())
@bot.callback_query_handler(func=lambda c:c.data=="status")
def status(c):
    if c.from_user.id!=ADMIN_ID: bot.answer_callback_query(c.id,"غير مسموح"); return
    bot.answer_callback_query(c.id,"تم")
    bot.send_message(c.message.chat.id,f"📍 <b>حالة التخزين</b>\n\n🖥️ <code>{DESKTOP}</code>\n\n📁 Telegram: <code>{TELEGRAM_DIR}</code>\n📂 محمد: <code>{MOHAMED_DIR}</code>\n🤖 Android Projects: <code>{ANDROID_PROJECTS}</code>\n📱 APKs: <code>{ANDROID_APKS}</code>",parse_mode="HTML",reply_markup=menu())
@bot.message_handler(content_types=["document"])
def documents(m):
    if not allowed(m): return
    try:
        name,data=doc(m); selected=mode.get(ADMIN_ID,"telegram")
        with lock:
            if selected=="android":
                if name.lower().endswith(".zip"):
                    incoming=save(data,ANDROID_INCOMING/name); project=extract_project(incoming,Path(name).stem)
                    bot.reply_to(m,f"✅ <b>تم تجهيز مشروع Android</b>\n\n📂 <code>{project}</code>",parse_mode="HTML"); return
                dest=save(data,(ANDROID_APKS if name.lower().endswith(".apk") else ANDROID_INCOMING)/name)
                bot.reply_to(m,f"✅ تم رفع الملف\n\n📄 {dest.name}\n📂 {dest.parent}"); return
            dest=save(data,(MOHAMED_DIR if selected=="mohamed" else TELEGRAM_DIR)/name)
            shown="Desktop\محمد" if selected=="mohamed" else "Desktop\Telegram"
            bot.reply_to(m,f"✅ تم استلام الملف\n\n📄 الاسم: {dest.name}\n\n📂 المكان: {shown}")
    except Exception as e: bot.reply_to(m,f"❌ حصل خطأ أثناء حفظ الملف:\n{e}")
@bot.message_handler(func=lambda m: bool(m.text) and not m.text.startswith("/"))
def links(m):
    if not allowed(m): return
    t=m.text.strip()
    if not re.match(r"^https?://",t,re.I): return
    d=MOHAMED_DIR if mode.get(ADMIN_ID)=="mohamed" else TELEGRAM_DIR
    p=save(("[InternetShortcut]\nURL="+t+"\n").encode(),d/"Telegram_Link.url")
    bot.reply_to(m,f"🔗 تم إنشاء اختصار الرابط\n\n📂 {p}")
while True:
    try: bot.infinity_polling(skip_pending=True,timeout=30,long_polling_timeout=30)
    except Exception as e: print(f"Telegram polling error: {e!r}",flush=True); time.sleep(5)
'@
            Set-Content -Path $receiver -Value $script -Encoding UTF8
          }

          $log = Join-Path $env:TEMP "telegram_receiver.log"
          $err = Join-Path $env:TEMP "telegram_receiver_error.log"
          $proc = Start-Process -FilePath (Get-Command python).Source `
            -ArgumentList @("-u", $receiver) `
            -WorkingDirectory $env:GITHUB_WORKSPACE `
            -WindowStyle Hidden `
            -RedirectStandardOutput $log `
            -RedirectStandardError $err `
            -PassThru

          Start-Sleep -Seconds 7
          if ($proc.HasExited) {
            if (Test-Path $log) { Get-Content $log -Tail 100 }
            if (Test-Path $err) { Get-Content $err -Tail 100 }
            throw "Telegram file receiver failed to start."
          }
          Write-Host "Telegram receiver is running (PID $($proc.Id))."
          Write-Host "Telegram files will be written to: $env:RDP_DESKTOP"
          for (;;) {
            if ($proc.HasExited) {
              if (Test-Path $log) { Get-Content $log -Tail 100 }
              if (Test-Path $err) { Get-Content $err -Tail 100 }
              throw "Telegram receiver stopped."
            }
            Start-Sleep -Seconds 60
          }

