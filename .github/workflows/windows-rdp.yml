name: Windows RDP via Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Connect Windows runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configure Windows RDP
        shell: pwsh
        env:
          RDP_USERNAME: ${{ secrets.user_name }}
          RDP_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_USERNAME)) { throw "GitHub Secret user_name is missing." }
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { throw "GitHub Secret PASSWORD is missing." }

          # Enable Remote Desktop.
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Create or update the RDP user.
          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $user = Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -Description "Temporary GitHub Actions RDP user" `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -UserMayNotChangePassword | Out-Null
          } else {
            Set-LocalUser -Name $env:RDP_USERNAME -Password $securePassword
            Enable-LocalUser -Name $env:RDP_USERNAME
          }

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue

          Restart-Service TermService -Force
          Start-Sleep -Seconds 3

          if ($null -eq (Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue)) {
            throw "RDP is not listening on TCP 3389."
          }

          Write-Host "Windows RDP is ready."

      - name: Get Tailscale IP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ip = (tailscale ip -4).Trim()
          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Could not get the Tailscale IPv4 address."
          }
          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Tailscale IPv4 obtained."

      - name: Send RDP details to Telegram
        shell: pwsh
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          RDP_USERNAME: ${{ secrets.user_name }}
          RDP_PASSWORD: ${{ secrets.PASSWORD }}
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:BOT_TOKEN)) { throw "GitHub Secret BOT_TOKEN is missing." }
          if ([string]::IsNullOrWhiteSpace($env:ADMIN_ID)) { throw "GitHub Secret ADMIN_ID is missing." }

          function Escape-Html([string]$value) {
            return $value.Replace("&", "&amp;").Replace("<", "&lt;").Replace(">", "&gt;")
          }

          $message = @"
          🟢 <b>Windows RDP Ready</b>
          
          🌐 IP: <code>$(Escape-Html $env:TAILSCALE_IP)</code>
          🔌 Port: <code>3389</code>
          👤 User: <code>$(Escape-Html $env:RDP_USERNAME)</code>
          🔑 Pass: <code>$(Escape-Html $env:RDP_PASSWORD)</code>
          
          🛡️ Tailscale only
          ⏳ Keep the Workflow running.
          "@

          $body = @{
            chat_id    = $env:ADMIN_ID
            text       = $message
            parse_mode = "HTML"
          }

          $response = Invoke-RestMethod `
            -Uri "https://api.telegram.org/bot$($env:BOT_TOKEN)/sendMessage" `
            -Method Post `
            -ContentType "application/x-www-form-urlencoded" `
            -Body $body

          if (-not $response.ok) {
            throw "Telegram API returned an unsuccessful response."
          }

          Write-Host "RDP details sent to Telegram."

      - name: Keep Windows RDP alive
        shell: pwsh
        run: |
          Write-Host "RDP is active. Keep this workflow running."
          for (;;) {
            Write-Host ("[{0}] RDP is still running..." -f (Get-Date -Format "yyyy-MM-dd HH:mm:ss"))
            Start-Sleep -Seconds 60
          }
